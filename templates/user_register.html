{% extends "base.html" %}
{% block title %}ثبت‌نام - زعفران فلاحتی{% endblock %}
{% block content %}
<div class="container">
    <div class="login-container">
        <h1>ثبت‌نام</h1>
        <form method="POST" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" required placeholder="نام کاربری دلخواه">
            </div>
            <div class="form-group">
                <label for="full_name">نام و نام خانوادگی</label>
                <input type="text" id="full_name" name="full_name" placeholder="مثال: علی احمدی">
            </div>
            <div class="form-group">
                <label for="phone">شماره تماس</label>
                <input type="tel" id="phone" name="phone" placeholder="09xxxxxxxxx">
            </div>
            <div class="form-group">
                <label for="address">آدرس</label>
                <textarea id="address" name="address" rows="3" placeholder="آدرس پستی خود را وارد کنید"></textarea>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" required placeholder="حداقل ۶ کاراکتر">
            </div>
            <div class="form-group">
                <label for="password_confirm">تکرار رمز عبور</label>
                <input type="password" id="password_confirm" name="password_confirm" required placeholder="رمز عبور را دوباره وارد کنید">
            </div>
            <button type="submit" class="btn btn-primary btn-block">ثبت‌نام</button>
        </form>
        <p style="text-align:center;margin-top:1rem;">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="{{ url_for('user_login') }}" style="color:var(--red);">وارد شوید</a>
        </p>
    </div>
</div>
{% endblock %}
