{% extends "base.html" %}
{% block title %}ورود - زعفران فلاحتی{% endblock %}
{% block content %}
<div class="container">
    <div class="login-container">
        <h1>ورود به حساب کاربری</h1>
        <form method="POST" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" required placeholder="نام کاربری خود را وارد کنید">
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" required placeholder="رمز عبور خود را وارد کنید">
            </div>
            <button type="submit" class="btn btn-primary btn-block">ورود</button>
        </form>
        <p style="text-align:center;margin-top:1rem;">
            حساب ندارید؟ <a href="{{ url_for('user_register') }}" style="color:var(--red);">ثبت‌نام کنید</a>
        </p>
    </div>
</div>
{% endblock %}
